[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docpipe-md"
version = "0.2.0"
description = "Reliable document-to-Markdown conversion with OCR fallback, per-unit quality checks, faithful XLSX rendering, and manifests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "82ko81" }]
dependencies = [
  "markitdown>=0.1",
  "openpyxl>=3.1",
  "pymupdf>=1.24",
  "pymupdf4llm>=0.0.17",
  "python-pptx>=1.0",
  "psutil>=5.9",
]

[project.scripts]
docpipe-md = "docpipe.cli:main"

[tool.setuptools.packages.find]
include = ["docpipe*"]
